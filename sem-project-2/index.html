<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Car Marketplace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-bar">
  <div class="container">
    <span>India's #1 Car Search Platform</span>
    <div class="top-links">
      <a href="#">Login</a>
      <a href="#">Register</a>
    </div>
  </div>
</div>


<header class="header">
  <div class="container header-flex">
    <div class="logo">Car<span>Market</span></div>

    <div class="search-box">
      <input type="text" placeholder="Search new or used cars">
      <button>Search</button>
    </div>
  </div>
</header>


<section class="hero">
  <div class="container">
    <h1>Find The Right Car For You</h1>

    <div class="tabs">
      <button class="active">New Cars</button>
      <button>Used Cars</button>
      <button>Sell Car</button>
      <button>Compare</button>
    </div>

    <div class="filters">
      <select>
        <option>Select City</option>
        <option>Delhi</option>
        <option>Mumbai</option>
        <option>Bangalore</option>
      </select>

      <select>
        <option>Select Brand</option>
        <option>Maruti</option>
        <option>Hyundai</option>
        <option>Tata</option>
      </select>

      <select>
        <option>Budget</option>
        <option>Under 5 Lakh</option>
        <option>5 - 10 Lakh</option>
        <option>10+ Lakh</option>
      </select>

      <button class="find-btn">Find Cars</button>
    </div>
  </div>
</section>

<section class="cars">
  <div class="container">
    <h2>Popular New Cars</h2>

    <div class="car-grid">
      <div class="car-card">
        <div class="car1-img"></div>
        <h3>Hatchback Car</h3>
        <p>₹5.5 Lakh onwards</p>
      </div>

      <div class="car-card">
        <div class="car2-img"></div>
        <h3>Sedan Car</h3>
        <p>₹8.2 Lakh onwards</p>
      </div>

      <div class="car-card">
        <div class="car3-img"></div>
        <h3>SUV Car</h3>
        <p>₹11.5 Lakh onwards</p>
      </div>

      <div class="car-card">
        <div class="car4-img"></div>
        <h3>Electric Car</h3>
        <p>₹9.8 Lakh onwards</p>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <p>© 2026 Car Marketplace Clone — Educational UI Project</p>
  </div>
</footer>

</body>
</html>
